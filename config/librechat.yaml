version: 1.3.8
cache: true
registration:
  socialLogins: []
endpoints:
  custom:
    - name: Hybrydowy Psycholog
      apiKey: dummy
      baseURL: http://therapist:8080/v1
      models:
        default:
          - hybrid-therapist
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: "Psycholog AI"
      iconURL: "https://raw.githubusercontent.com/paulomac1000/hybrid-therapist/main/docs/favicon.ico"
      addParams:
        model:
          default:
            overrideProperty: model
      dropParams:
        - temperature
        - top_p
        - frequency_penalty
        - presence_penalty
