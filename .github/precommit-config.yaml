# .github/precommit-config.yaml
# Precommit Hook Config v1
# Generated by: precommit-hook-architect
# Adapted for: hybrid-therapist (.NET 10 + xUnit + Semgrep + AFDS)

project:
  language: dotnet
  solution: HybridTherapist.sln
  test_project: tests/HybridTherapist.Tests
  dotnet_path: auto  # $HOME/.dotnet or system PATH

steps:
  conflicts:
    enabled: true
    command: git diff --cached --name-only --diff-filter=ACM | xargs grep -l '<<<<<<<'
    level: L1
    timeout: 10
    position: pre-check

  large_files:
    enabled: true
    command: git diff --cached --name-only --diff-filter=ACM | xargs -I{} ls -l {} | awk '$5 > 1048576'
    level: L2
    timeout: 10
    position: pre-check

  secrets:
    enabled: true
    command: git diff --cached --name-only --diff-filter=ACM | xargs grep -l 'BEGIN.*PRIVATE KEY'
    level: L2
    timeout: 10
    position: pre-check

  trailing_whitespace:
    enabled: true
    command: git diff --cached --check
    level: L3
    timeout: 10
    position: pre-check

  restore:
    enabled: true
    command: dotnet restore --nologo -v q
    level: L1
    timeout: 60
    position: 1

  format:
    enabled: true
    command: dotnet format HybridTherapist.sln --verify-no-changes --no-restore
    level: L2
    timeout: 30
    position: 2
    staged_only: true
    ci_aware: true

  build:
    enabled: true
    command: dotnet build HybridTherapist.sln -c Release --nologo -v q
    level: L1
    timeout: 120
    position: 3

  test:
    enabled: true
    command: dotnet test tests/HybridTherapist.Tests -c Release --nologo
    level: L1
    timeout: 300
    position: 4

  security:
    enabled: true
    command: semgrep --config p/ci --error --quiet
    level: L2
    timeout: 60
    position: 5
    staged_only: true

  docs:
    enabled: true
    command: curl URL | python3 - --config afds_config.yaml ./
    level: L3
    timeout: 30
    position: 6

hooks:
  pre_commit: .githooks/pre-commit
  pre_push: .githooks/pre-push
  commit_msg: .githooks/commit-msg
