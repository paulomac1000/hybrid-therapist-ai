name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: "10.0.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Format check
        run: dotnet format HybridTherapist.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HybridTherapist.sln --no-restore -c Release

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarQube Begin (PR)
        if: github.event_name == 'pull_request' && vars.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"hybrid-therapist" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
            /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
            /d:sonar.pullrequest.base="${{ github.base_ref }}" \
            /d:sonar.scm.revision="${{ github.event.pull_request.head.sha }}"

      - name: SonarQube Begin (main)
        if: github.event_name != 'pull_request' && vars.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"hybrid-therapist" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.branch.name="${{ github.ref_name }}"

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/HybridTherapist.Tests/HybridTherapist.Tests.csproj \
            --no-restore -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Verify coverage data exists
        run: |
          COVFILE=$(find ./TestResults -name 'coverage.cobertura.xml' 2>/dev/null | head -1)
          if [ -z "$COVFILE" ]; then
            echo "❌ No coverage.cobertura.xml found — coverage collection failed"
            exit 1
          fi
          echo "Found: $COVFILE"

      - name: Generate coverage report and check thresholds
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:MarkdownSummaryGithub \
            --minimumCoverageThresholds:lineCoverage=55 \
            --minimumCoverageThresholds:branchCoverage=50

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always() && hashFiles('./TestResults/CoverageReport/SummaryGithub.md') != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          path: ./TestResults/CoverageReport/SummaryGithub.md

      - name: SonarQube End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3
        with:
          name: Unit Tests
          path: ./TestResults/test-results.trx
          reporter: dotnet-trx

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

  cassette-benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Build
        run: dotnet build HybridTherapist.sln --no-restore -c Release

      - name: Run cassette benchmarks
        run: dotnet test tests/HybridTherapist.Integration -c Release --no-build --filter "FullyQualifiedName~HandBenchmark"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Build Docker image
        run: docker build -t hybrid-therapist:test .

      - name: Smoke test
        run: |
          docker run -d --rm \
            -p 8080:8080 \
            --name hybrid-therapist-smoke \
            hybrid-therapist:test
          sleep 10
          curl -fsS --retry 10 --retry-delay 3 \
            http://localhost:8080/v1/models || exit 1
          echo "Smoke test OK"
          docker stop hybrid-therapist-smoke

  pack-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: docker-smoke
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Build
        run: dotnet build HybridTherapist.sln --no-restore -c Release

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack HybridTherapist.sln --no-build -c Release -o ./nupkg \
            -p:PackageVersion=$VERSION

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
