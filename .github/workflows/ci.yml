name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: "8.0.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - uses: actions/setup-dotnet@ffbaf985960a32c27bbcb5cd2e78a5bb14ee97a9  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Format check
        run: dotnet format HybridTherapist.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HybridTherapist.sln --no-restore -c Release

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - uses: actions/setup-dotnet@ffbaf985960a32c27bbcb5cd2e78a5bb14ee97a9  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/HybridTherapist.Tests/HybridTherapist.Tests.csproj \
            --no-restore -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:MarkdownSummaryGithub

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5  # v3
        with:
          name: Unit Tests
          path: ./TestResults/test-results.trx
          reporter: dotnet-trx

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - name: Build Docker image
        run: docker build -t hybrid-therapist:test .

      - name: Smoke test
        run: |
          docker run -d --rm \
            -p 8080:8080 \
            --name hybrid-therapist-smoke \
            hybrid-therapist:test
          sleep 10
          curl -fsS --retry 10 --retry-delay 3 \
            http://localhost:8080/v1/models || exit 1
          echo "Smoke test OK"
          docker stop hybrid-therapist-smoke
