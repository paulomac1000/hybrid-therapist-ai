name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: "10.0.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Format check
        run: dotnet format HybridTherapist.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HybridTherapist.sln --no-restore -c Release

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore HybridTherapist.sln

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/HybridTherapist.Tests/HybridTherapist.Tests.csproj \
            --no-restore -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:MarkdownSummaryGithub

      - name: Check coverage thresholds
        if: hashFiles('./TestResults/**/coverage.cobertura.xml') != ''
        run: |
          LINE_COV=$(grep -oP 'Line coverage: \K[0-9.]+(?=%)' ./TestResults/CoverageReport/SummaryGithub.md 2>/dev/null || echo "0")
          BRANCH_COV=$(grep -oP 'Branch coverage: \K[0-9.]+(?=%)' ./TestResults/CoverageReport/SummaryGithub.md 2>/dev/null || echo "0")
          echo "Line coverage: ${LINE_COV}% (threshold: 75%)"
          echo "Branch coverage: ${BRANCH_COV}% (threshold: 60%)"
          if (( $(echo "$LINE_COV < 75" | bc -l) )); then
            echo "❌ Line coverage ${LINE_COV}% is below 75% threshold"
            exit 1
          fi
          if (( $(echo "$BRANCH_COV < 60" | bc -l) )); then
            echo "❌ Branch coverage ${BRANCH_COV}% is below 60% threshold"
            exit 1
          fi
          echo "✅ Coverage thresholds met"

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3
        with:
          name: Unit Tests
          path: ./TestResults/test-results.trx
          reporter: dotnet-trx

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Build Docker image
        run: docker build -t hybrid-therapist:test .

      - name: Smoke test
        run: |
          docker run -d --rm \
            -p 8080:8080 \
            --name hybrid-therapist-smoke \
            hybrid-therapist:test
          sleep 10
          curl -fsS --retry 10 --retry-delay 3 \
            http://localhost:8080/v1/models || exit 1
          echo "Smoke test OK"
          docker stop hybrid-therapist-smoke
